name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Verify release version
        shell: python
        env:
          PYTHONPATH: .
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          sys.path.insert(0, str(Path.cwd().resolve()))
          from meta import __version__

          assert os.environ["RELEASE_TAG"] == f"v{__version__}", "Tag and meta.py version differ"
          with Path("pyproject.toml").open("rb") as stream:
              assert tomllib.load(stream)["project"]["version"] == __version__, "pyproject.toml version differs"
          version_info = Path("version_info.txt").read_text(encoding="utf-8")
          parts = tuple(map(int, __version__.split("."))) + (0,)
          assert f"filevers={parts}" in version_info, "version_info.txt file version differs"
          assert f"prodvers={parts}" in version_info, "version_info.txt product version differs"
          assert re.search(rf"StringStruct\('FileVersion', '{re.escape(__version__)}\.0'\)", version_info)
          assert re.search(rf"StringStruct\('ProductVersion', '{re.escape(__version__)}\.0'\)", version_info)
      - name: Test
        run: python -m pytest -q -m "not device"
      - name: Build onefile executable
        run: python -m PyInstaller --noconfirm --clean Ahenk.spec
      - name: Verify built CLI executable
        shell: pwsh
        run: |
          dist\Ahenk-cli.exe --version
          dist\Ahenk-cli.exe --list-langs
      - name: Sign executables (optional Authenticode)
        if: env.WINDOWS_CERT_PFX_BASE64 != ''
        shell: pwsh
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse |
              Where-Object { $_.FullName -match '\\x64\\' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) {
              throw "signtool.exe not found in Windows Kits 10 bin"
            }
            & $signtool sign /f $pfxPath /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\Ahenk.exe dist\Ahenk-cli.exe
            if ($LASTEXITCODE -ne 0) {
              throw "signtool failed with exit code $LASTEXITCODE"
            }
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }
      - name: Create SHA-256 checksums
        shell: python
        run: |
          import hashlib
          from pathlib import Path

          for name in ("Ahenk.exe", "Ahenk-cli.exe"):
              target = Path(f"dist/{name}")
              if target.is_file():
                  sha = hashlib.sha256(target.read_bytes()).hexdigest()
                  Path(f"dist/{name}.sha256").write_text(f"{sha} *{name}\n", encoding="ascii")
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            dist/Ahenk.exe `
            dist/Ahenk.exe.sha256 `
            dist/Ahenk-cli.exe `
            dist/Ahenk-cli.exe.sha256 `
            --verify-tag `
            --generate-notes `
            --title "Ahenk $env:GITHUB_REF_NAME"
