name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Lint with ruff
        run: |
          ruff check .
      - name: Run pytest
        run: |
          pytest -v -m "not device"
      - name: Verify wheel packaging and CLI entrypoint
        shell: pwsh
        run: |
          pip install build
          python -m build --wheel
          $whl = (Get-Item dist/*.whl).FullName
          pip install $whl
          python -c "import sys, cli; assert 'tkinter' not in sys.modules and 'gui.app' not in sys.modules"
          ahenk-cli --version
          ahenk-cli --list-langs
