[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ahenk"
version = "0.5.0"
description = "PC sistem sesini veya mikrofonu Gemini Live ile gerçek zamanlı çeviren Windows uygulaması"
readme = "README.md"
authors = [{ name = "Enes Eliaçık" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "soundcard",
    "numpy",
    "python-dotenv",
]

[project.scripts]
ahenk = "main:main"
ahenk-cli = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "device: fiziki ses aygıtı gerektiren testler",
]
